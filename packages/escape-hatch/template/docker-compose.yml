# Optional local Postgres for future EH-030/031 work.
# Not required for `npm run build` or soft-preview.
# Do not put production credentials here.
# Password is deliberately dev-only — never expose this profile on a public interface.

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["db"]
    environment:
      POSTGRES_USER: escape_hatch
      POSTGRES_PASSWORD: escape_hatch_dev_only
      POSTGRES_DB: escape_hatch
    ports:
      # Loopback only — do not bind 0.0.0.0 for the profile database.
      - "127.0.0.1:5433:5432"
    volumes:
      - eh_pg_data:/var/lib/postgresql/data
      - ./db/schema:/docker-entrypoint-initdb.d:ro

volumes:
  eh_pg_data:
